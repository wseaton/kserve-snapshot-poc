name: vllm-checkpoint

on:
  pull_request:
    paths:
      - images/vllm-checkpoint/**
      - .github/workflows/vllm-checkpoint.yaml
  push:
    branches: [main]
    paths:
      - images/vllm-checkpoint/**
      - .github/workflows/vllm-checkpoint.yaml
  workflow_dispatch:

concurrency:
  group: vllm-checkpoint-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/vllm-checkpoint

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: images/vllm-checkpoint
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  references:
    needs: image
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/image-reference.yaml
    permissions:
      contents: write
      pull-requests: write
    with:
      name: vllm-checkpoint
      digest: ${{ needs.image.outputs.digest }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stand-in
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stand-in
  template:
    metadata:
      labels:
        app: stand-in
        snapshot.llm-d.ai/workload: stand-in
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: main
          image: ghcr.io/wseaton/snapshotd/snapshotd
          imagePullPolicy: Never
          command: [snapshotd-shim, --, stand-in, serve]
          ports:
            - name: control
              containerPort: 50051
            - name: http
              containerPort: 8000
            - name: ready
              containerPort: 8001
          readinessProbe:
            tcpSocket:
              port: ready
            periodSeconds: 1

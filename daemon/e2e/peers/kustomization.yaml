apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapshotd
resources:
  - ../../deploy/node
components:
  - ../../deploy/components/peers
images:
  - name: ghcr.io/wseaton/snapshotd/snapshotd
    newName: localhost/snapshotd-e2e-peers
    newTag: dev
  - name: ghcr.io/wseaton/snapshotd/snapshot-agent
    newName: localhost/snapshotd-e2e-peers
    newTag: dev
patches:
  - path: daemonset.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapshotd
resources:
  - ../../deploy/node
components:
  - ../../deploy/components/peers
images:
  - name: ghcr.io/wseaton/kserve-snapshot-poc/snapshotd
    newName: localhost/snapshotd-e2e-peers
    newTag: dev
  - name: ghcr.io/wseaton/kserve-snapshot-poc/snapshot-agent
    newName: localhost/snapshotd-e2e-peers
    newTag: dev
patches:
  - path: daemonset.yaml
  - target:
      group: cert-manager.io
    patch: |
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: any

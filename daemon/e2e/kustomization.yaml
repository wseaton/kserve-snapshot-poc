apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../deploy/node
  - workload.yaml
images:
  - name: ghcr.io/wseaton/kserve-snapshot-poc/snapshotd
    newName: localhost/snapshotd-e2e
    newTag: dev
  - name: ghcr.io/wseaton/kserve-snapshot-poc/snapshot-agent
    newName: localhost/snapshotd-e2e
    newTag: dev
configMapGenerator:
  - name: snapshotd-classes
    namespace: snapshotd
    literals:
      - 'classes.json={"scratch": {"dir": "/stores/scratch", "namespace_limit_gib": 1}}'
patches:
  - path: daemonset.yaml

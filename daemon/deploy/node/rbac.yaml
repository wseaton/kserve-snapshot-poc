apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snapshotd-node
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "statefulsets"]
    verbs: ["get"]
  - apiGroups: ["leaderworkerset.x-k8s.io"]
    resources: ["leaderworkersets"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snapshotd-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snapshotd-node
subjects:
  - kind: ServiceAccount
    name: snapshotd
---
# Bind in a namespace to let its pods restore checkpoints, for example to
# the group system:serviceaccounts:<namespace>, and to the ServiceAccount
# snapshotd/snapshotd to let the daemons move them between nodes. Nothing is
# bound by default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snapshotd-checkpoint-reader
rules:
  - apiGroups: ["snapshot.llm-d.ai"]
    resources: ["checkpoints"]
    verbs: ["get"]

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: snapshotd
spec:
  template:
    spec:
      containers:
        - name: snapshotd
          env:
            - name: SNAPSHOTD_TIMESLICE_LISTEN
              value: 0.0.0.0:9001
          ports:
            - name: timeslice
              containerPort: 9001
              hostPort: 9001

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: snapshotd
spec:
  template:
    spec:
      containers:
        - name: snapshotd
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SNAPSHOTD_PEERS
              value: snapshotd-peers.$(POD_NAMESPACE).svc:8443
      volumes:
        - name: peer-ca
          secret: null
          configMap:
            name: snapshotd-peers-ca
            items:
              - key: service-ca.crt
                path: ca.crt

[package]
name = "snapshot-daemon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[[bin]]
name = "snapshotd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cudarc = { version = "=0.19.9", default-features = false, features = ["std", "driver", "cuda-13000", "dynamic-loading"] }
cuinterpose-protocol = { git = "https://github.com/ai-dynamo/snapshot", rev = "bc9d2161d2a7f203551e5b7e237defd90b1e9aa1" }
hex = "0.4"
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = "1"

[lints.clippy]
all = "warn"

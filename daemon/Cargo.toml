[package]
name = "snapshot-daemon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[[bin]]
name = "snapshotd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cudarc = { version = "=0.19.9", default-features = false, features = ["std", "driver", "cuda-13000", "dynamic-loading"] }
cuinterpose-protocol = { git = "https://github.com/ai-dynamo/snapshot", rev = "bc9d2161d2a7f203551e5b7e237defd90b1e9aa1" }
hex = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
libloading = "0.9"
nixl-sys = { git = "https://github.com/wseaton/nixl", rev = "70b07d16232c9654b7ce8597de2c6f9c12032425", optional = true }
openssl = "0.10"
prost = "0.14"
rustix = { version = "1", features = ["fs", "mm", "mount", "net", "pipe", "process", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.29"
walkdir = { version = "2", optional = true }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"

[features]
nixl = ["dep:nixl-sys", "dep:walkdir"]

[lints.clippy]
all = "warn"

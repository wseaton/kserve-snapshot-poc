apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snapshot-bench-models
spec:
  accessModes: [ReadWriteMany]
  storageClassName: shared-vast
  resources:
    requests:
      storage: 1500Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snapshot-bench-compile-cache
spec:
  accessModes: [ReadWriteMany]
  storageClassName: shared-vast
  resources:
    requests:
      storage: 100Gi

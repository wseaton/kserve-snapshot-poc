apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapshot-bench
nameSuffix: -prefill
resources:
  - ../../../../daemon/deploy/workload
components:
  - ../../../components/images
labels:
  - pairs:
      app: snapshot-serve-prefill
    includeSelectors: true
patches:
  - target:
      kind: Deployment
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: snapshot-serve
      spec:
        template:
          metadata:
            labels:
              snapshot.llm-d.ai/workload: snapshot-serve-prefill
          spec:
            containers:
              - name: main
                env:
                  - name: POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                    value: $(POD_IP)
                  - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                    value: "5600"
                  - name: UCX_TLS
                    value: tcp,cuda_copy
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: --checkpoint-prepare-on-startup
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: --kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail"}

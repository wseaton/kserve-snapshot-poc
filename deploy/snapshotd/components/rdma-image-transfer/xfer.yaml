apiVersion: v1
kind: Pod
metadata:
  name: restore-bench
spec:
  containers:
    - name: main
      volumeMounts:
        - name: mem
          mountPath: /mem
    # Copies /work/<tag> to or from another node.
    - name: xfer
      image: ghcr.io/wseaton/snapshotd/snapshotd
      command: [sleep, infinity]
      env:
        - name: HOME
          value: /tmp
      securityContext:
        capabilities:
          add: [IPC_LOCK, SYS_RESOURCE]
      resources:
        requests:
          cpu: "8"
          memory: 16Gi
          rdma/ib: "1"
        limits:
          memory: 256Gi
          rdma/ib: "1"
      volumeMounts:
        - name: snapshot-bin
          mountPath: /models/bin
        - name: work
          mountPath: /work
        - name: mem
          mountPath: /mem
  volumes:
    # RAM-backed, for checkpoints that should not touch a disk (IMG_DIR=/mem/... in lifecycle.sh).
    - name: mem
      emptyDir:
        medium: Memory
        sizeLimit: 256Gi

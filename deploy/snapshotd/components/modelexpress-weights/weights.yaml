apiVersion: v1
kind: Pod
metadata:
  name: restore-bench
spec:
  containers:
    - name: main
      resources:
        requests:
          rdma/ib: "8"
        limits:
          rdma/ib: "8"
      volumeMounts:
        - name: podinfo
          mountPath: /etc/snapshot-podinfo
          readOnly: true
  volumes:
    # A restored process keeps the source's environment; ModelExpress reads who it is from here.
    - name: podinfo
      downwardAPI:
        items:
          - path: name
            fieldRef:
              fieldPath: metadata.name
          - path: namespace
            fieldRef:
              fieldPath: metadata.namespace
          - path: uid
            fieldRef:
              fieldPath: metadata.uid

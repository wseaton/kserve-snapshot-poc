apiVersion: batch/v1
kind: Job
metadata:
  name: download-deepseek-v4-1-flash
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: download
          image: vllm/vllm-openai:v0.27.1-ubuntu2404@sha256:dafea057f24b7d42716331a48e2db4e1f204f877a3aa759cb7e4c37e64ca2eee
          command:
            - hf
            - download
            - deepseek-ai/DeepSeek-V4.1-Flash
            - --revision
            - 2cba9e42aa026125f3ed06c6d98c1db82f7ca027
            - --local-dir
            - /models/DeepSeek-V4.1-Flash
            - --max-workers
            - "16"
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: snapshot-bench-models

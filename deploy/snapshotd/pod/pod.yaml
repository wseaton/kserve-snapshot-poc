# Privileged benchmark pod.
apiVersion: v1
kind: Pod
metadata:
  name: restore-bench
  labels:
    app: snapshot-bench
  annotations:
    kubectl.kubernetes.io/default-container: main
spec:
  restartPolicy: Never
  imagePullSecrets:
    - name: quay-wseaton-pull
  initContainers:
    - name: snapshotd
      image: ghcr.io/wseaton/kserve-snapshot-poc/snapshotd
      command:
        - sh
        - -c
        - cp -a /opt/snapshotd/bin/. /models/bin/ && cp -a /opt/snapshotd/exp/. /exp/
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: snapshot-bin
          mountPath: /models/bin
        - name: exp
          mountPath: /exp
    - name: snapshot-binaries
      image: quay.io/wseaton/snapshot-agent@sha256:7fe695035e6506bed4cb38b8678de8d0825d515fbabded58220194d17b4bce6f
      command: [cp, -a, /snapshot-binaries, /out/]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: snapshot-cuda
          mountPath: /out
  containers:
    - name: main
      image: ghcr.io/wseaton/kserve-snapshot-poc/vllm-checkpoint
      command: [python3, -c, "import os,time\nwhile True:\n  try: os.waitpid(-1,0)\n  except ChildProcessError: time.sleep(1)"]
      securityContext:
        privileged: true
      env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: XDG_CACHE_HOME
          value: /compile-cache/xdg
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /compile-cache/torchinductor
        - name: TRITON_CACHE_DIR
          value: /compile-cache/triton
        - name: CUDA_CACHE_PATH
          value: /compile-cache/cuda
        - name: DG_JIT_CACHE_DIR
          value: /compile-cache/deepgemm
        - name: FLASHINFER_WORKSPACE_BASE
          value: /compile-cache/flashinfer
        - name: VLLM_CACHE_ROOT
          value: /compile-cache/vllm
        - name: TILELANG_CACHE_DIR
          value: /compile-cache/tilelang
        - name: PYTORCH_ALLOC_CONF
          value: pinned_max_round_threshold_mb:1,pinned_max_cached_size_mb:1
      resources:
        requests:
          cpu: "32"
          memory: 512Gi
          nvidia.com/gpu: "8"
        limits:
          memory: 1Ti
          nvidia.com/gpu: "8"
      volumeMounts:
        - name: exp
          mountPath: /exp
        - name: models
          mountPath: /models
        - name: snapshot-bin
          mountPath: /models/bin
        - name: compile-cache
          mountPath: /compile-cache
        - name: work
          mountPath: /work
        - name: dshm
          mountPath: /dev/shm
        - name: snapshot-cuda
          mountPath: /tmp/snapshot-cuda
          readOnly: true
        - name: device-plugins
          mountPath: /host-device-plugins
          readOnly: true
  volumes:
    - name: exp
      emptyDir: {}
    - name: snapshot-bin
      emptyDir: {}
    - name: snapshot-cuda
      emptyDir: {}
    - name: models
      persistentVolumeClaim:
        claimName: snapshot-bench-models
    - name: compile-cache
      persistentVolumeClaim:
        claimName: snapshot-bench-compile-cache
    - name: work
      emptyDir: {}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 64Gi
    - name: device-plugins
      hostPath:
        path: /var/lib/kubelet/device-plugins

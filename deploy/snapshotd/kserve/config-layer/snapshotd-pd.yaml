            - name: VLLM_ALLREDUCE_USE_SYMM_MEM
              value: "0"
            - name: VLLM_USE_NCCL_SYMM_MEM
              value: "0"
            - name: KSERVE_INFER_ROCE
              value: "false"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: XDG_CACHE_HOME
              value: /dev/shm/cache/xdg
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /dev/shm/cache/torchinductor
            - name: TRITON_CACHE_DIR
              value: /dev/shm/cache/triton
            - name: CUDA_CACHE_PATH
              value: /dev/shm/cache/cuda
            - name: DG_JIT_CACHE_DIR
              value: /dev/shm/cache/deepgemm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /dev/shm/cache/flashinfer
            - name: VLLM_CACHE_ROOT
              value: /dev/shm/cache/vllm
            - name: TILELANG_CACHE_DIR
              value: /dev/shm/cache/tilelang
            - name: PYTORCH_ALLOC_CONF

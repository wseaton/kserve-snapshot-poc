apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapshot-bench
resources:
  - ../base
  - ../pod
  - target
components:
  - ../components/rdma-image-transfer
  - ../components/modelexpress-weights
patches:
  - path: spread.yaml
    target:
      kind: Pod
      labelSelector: app=snapshot-bench

# Qwen3-8B as a DisaggregatedSet with NIXL prefill and decode roles. Both roles carry the same
# workload label; the daemon keeps their checkpoints apart by disaggregatedset.x-k8s.io/role, and
# a checkpoint belongs to one disaggregatedset.x-k8s.io/revision, the boundary the llm-d rollout
# screener pairs pods within.
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: snapshot-serve
spec:
  roles:
    - name: prefill
      spec:
        replicas: 1
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels:
                snapshot.llm-d.ai/workload: snapshot-serve
            spec:
              initContainers:
                - name: snapshot-tools
                  image: ghcr.io/wseaton/snapshotd/snapshotd
                  command:
                    - cp
                    - /opt/snapshotd/bin/snapshotd-shim
                    - /opt/snapshotd/exp/noiouring.py
                    - /snapshot-tools/
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                  volumeMounts:
                    - name: snapshot-tools
                      mountPath: /snapshot-tools
              containers:
                - name: main
                  image: ghcr.io/wseaton/snapshotd/vllm-checkpoint
                  command:
                    - /snapshot-tools/snapshotd-shim
                    - --
                    - sh
                    - -c
                    - >-
                      exec env "LD_LIBRARY_PATH=/usr/local/cuda-13.1/compat:${LD_LIBRARY_PATH}"
                      LD_PRELOAD=/run/snapshotd/tools/cuinterpose/libcuinterpose.so
                      python3 /snapshot-tools/noiouring.py vllm serve "$@"
                    - vllm
                    - /models/Qwen3-8B
                    - --served-model-name=qwen3-8b
                    - --enable-sleep-mode
                    - --checkpoint-release-weights
                    - --host=0.0.0.0
                    - --port=8000
                    - --grpc-port=50051
                    - --checkpoint-prepare-on-startup
                    - --kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail"}
                  ports:
                    - name: http
                      containerPort: 8000
                    - name: control
                      containerPort: 50051
                    - name: ready
                      containerPort: 8001
                  readinessProbe:
                    tcpSocket:
                      port: ready
                    periodSeconds: 2
                  env:
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      value: $(POD_IP)
                    - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                      value: "5600"
                    - name: UCX_TLS
                      value: tcp,cuda_copy
                    - name: HOME
                      value: /dev/shm/home
                    - name: VLLM_USE_RUST_FRONTEND
                      value: "1"
                    - name: VLLM_WORKER_MULTIPROC_METHOD
                      value: spawn
                    - name: VLLM_HOST_IP
                      value: 127.0.0.1
                    - name: CUDA_DEVICE_ORDER
                      value: PCI_BUS_ID
                    - name: NCCL_NVLS_ENABLE
                      value: "0"
                    - name: NCCL_IB_DISABLE
                      value: "1"
                    - name: NCCL_SOCKET_IFNAME
                      value: lo
                    - name: GLOO_SOCKET_IFNAME
                      value: lo
                    - name: VLLM_ALLREDUCE_USE_SYMM_MEM
                      value: "0"
                    - name: VLLM_USE_NCCL_SYMM_MEM
                      value: "0"
                    - name: XDG_CACHE_HOME
                      value: /compile-cache/xdg
                    - name: TORCHINDUCTOR_CACHE_DIR
                      value: /compile-cache/torchinductor
                    - name: TRITON_CACHE_DIR
                      value: /compile-cache/triton
                    - name: CUDA_CACHE_PATH
                      value: /compile-cache/cuda
                    - name: DG_JIT_CACHE_DIR
                      value: /compile-cache/deepgemm
                    - name: FLASHINFER_WORKSPACE_BASE
                      value: /compile-cache/flashinfer
                    - name: VLLM_CACHE_ROOT
                      value: /compile-cache/vllm
                    - name: TILELANG_CACHE_DIR
                      value: /compile-cache/tilelang
                    - name: PYTORCH_ALLOC_CONF
                      value: pinned_max_round_threshold_mb:1,pinned_max_cached_size_mb:1
                  resources:
                    requests:
                      cpu: "8"
                      memory: 64Gi
                      nvidia.com/gpu: "1"
                    limits:
                      memory: 128Gi
                      nvidia.com/gpu: "1"
                  volumeMounts:
                    - name: snapshot-tools
                      mountPath: /snapshot-tools
                    - name: snapshot-run
                      mountPath: /run/snapshotd
                    - name: models
                      mountPath: /models
                    - name: dshm
                      mountPath: /dev/shm
                    - name: dshm
                      mountPath: /compile-cache
                      subPath: compile-cache
              volumes:
                - name: snapshot-tools
                  emptyDir: {}
                - name: snapshot-run
                  emptyDir: {}
                - name: models
                  persistentVolumeClaim:
                    claimName: snapshot-bench-models
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi
    - name: decode
      spec:
        replicas: 1
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels:
                snapshot.llm-d.ai/workload: snapshot-serve
            spec:
              initContainers:
                - name: snapshot-tools
                  image: ghcr.io/wseaton/snapshotd/snapshotd
                  command:
                    - cp
                    - /opt/snapshotd/bin/snapshotd-shim
                    - /opt/snapshotd/exp/noiouring.py
                    - /snapshot-tools/
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                  volumeMounts:
                    - name: snapshot-tools
                      mountPath: /snapshot-tools
              containers:
                - name: main
                  image: ghcr.io/wseaton/snapshotd/vllm-checkpoint
                  command:
                    - /snapshot-tools/snapshotd-shim
                    - --
                    - sh
                    - -c
                    - >-
                      exec env "LD_LIBRARY_PATH=/usr/local/cuda-13.1/compat:${LD_LIBRARY_PATH}"
                      LD_PRELOAD=/run/snapshotd/tools/cuinterpose/libcuinterpose.so
                      python3 /snapshot-tools/noiouring.py vllm serve "$@"
                    - vllm
                    - /models/Qwen3-8B
                    - --served-model-name=qwen3-8b
                    - --enable-sleep-mode
                    - --checkpoint-release-weights
                    - --host=0.0.0.0
                    - --port=8000
                    - --grpc-port=50051
                    - --checkpoint-prepare-on-startup
                    - --kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail"}
                  ports:
                    - name: http
                      containerPort: 8000
                    - name: control
                      containerPort: 50051
                    - name: ready
                      containerPort: 8001
                  readinessProbe:
                    tcpSocket:
                      port: ready
                    periodSeconds: 2
                  env:
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      value: $(POD_IP)
                    - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                      value: "5600"
                    - name: UCX_TLS
                      value: tcp,cuda_copy
                    - name: HOME
                      value: /dev/shm/home
                    - name: VLLM_USE_RUST_FRONTEND
                      value: "1"
                    - name: VLLM_WORKER_MULTIPROC_METHOD
                      value: spawn
                    - name: VLLM_HOST_IP
                      value: 127.0.0.1
                    - name: CUDA_DEVICE_ORDER
                      value: PCI_BUS_ID
                    - name: NCCL_NVLS_ENABLE
                      value: "0"
                    - name: NCCL_IB_DISABLE
                      value: "1"
                    - name: NCCL_SOCKET_IFNAME
                      value: lo
                    - name: GLOO_SOCKET_IFNAME
                      value: lo
                    - name: VLLM_ALLREDUCE_USE_SYMM_MEM
                      value: "0"
                    - name: VLLM_USE_NCCL_SYMM_MEM
                      value: "0"
                    - name: XDG_CACHE_HOME
                      value: /compile-cache/xdg
                    - name: TORCHINDUCTOR_CACHE_DIR
                      value: /compile-cache/torchinductor
                    - name: TRITON_CACHE_DIR
                      value: /compile-cache/triton
                    - name: CUDA_CACHE_PATH
                      value: /compile-cache/cuda
                    - name: DG_JIT_CACHE_DIR
                      value: /compile-cache/deepgemm
                    - name: FLASHINFER_WORKSPACE_BASE
                      value: /compile-cache/flashinfer
                    - name: VLLM_CACHE_ROOT
                      value: /compile-cache/vllm
                    - name: TILELANG_CACHE_DIR
                      value: /compile-cache/tilelang
                    - name: PYTORCH_ALLOC_CONF
                      value: pinned_max_round_threshold_mb:1,pinned_max_cached_size_mb:1
                  resources:
                    requests:
                      cpu: "8"
                      memory: 64Gi
                      nvidia.com/gpu: "1"
                    limits:
                      memory: 128Gi
                      nvidia.com/gpu: "1"
                  volumeMounts:
                    - name: snapshot-tools
                      mountPath: /snapshot-tools
                    - name: snapshot-run
                      mountPath: /run/snapshotd
                    - name: models
                      mountPath: /models
                    - name: dshm
                      mountPath: /dev/shm
                    - name: dshm
                      mountPath: /compile-cache
                      subPath: compile-cache
              volumes:
                - name: snapshot-tools
                  emptyDir: {}
                - name: snapshot-run
                  emptyDir: {}
                - name: models
                  persistentVolumeClaim:
                    claimName: snapshot-bench-models
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi

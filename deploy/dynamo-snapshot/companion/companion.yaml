apiVersion: apps/v1
kind: Deployment
metadata:
  name: companion
  namespace: kserve-dynamo-snapshot
spec:
  template:
    spec:
      imagePullSecrets:
        - name: quay-wseaton-pull
      containers:
        - name: companion
          command:
            - /companion
            - --webhook-cert-dir=/certs
            - --cuinterpose-image=ghcr.io/ai-dynamo/snapshot/agent:v0.0.0-gbc9d2161

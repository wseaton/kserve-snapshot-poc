apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kds-snapshot-system
resources:
  - namespace.yaml
helmCharts:
  - name: snapshot
    releaseName: kds-snapshot
    namespace: kds-snapshot-system
    includeCRDs: true
    valuesFile: values.yaml
components:
  - ../../components/images
patches:
  - target:
      kind: DaemonSet
      name: kds-snapshot-agent
    patch: |-
      - op: remove
        path: /spec/template/spec/runtimeClassName

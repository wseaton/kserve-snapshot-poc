{% macro entry(title, url, path, toc, here) %}
<li>
  {% if toc | length > 0 %}
  <details{% if path == here %} open{% endif %}>
    <summary><a href="{{ url | safe }}"{% if path == here %} aria-current="page"{% endif %}>{{ title }}</a></summary>
    <ul>
      {% for h in toc %}<li><a href="{{ h.permalink | safe }}">{{ h.title }}</a></li>{% endfor %}
    </ul>
  </details>
  {% else %}
  <a class="leaf" href="{{ url | safe }}"{% if path == here %} aria-current="page"{% endif %}>{{ title }}</a>
  {% endif %}
</li>
{% endmacro entry %}

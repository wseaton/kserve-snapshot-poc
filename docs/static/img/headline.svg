<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328" role="img" aria-label="Seconds until a DeepSeek-V4.1-Flash replica serves on 8 GPUs">
<style>
text { font: 13px -apple-system, system-ui, "Segoe UI", sans-serif; fill: #0b0b0b; }
.muted, .label { fill: #6f6e69; font-size: 12.5px; } .value { font-weight: 650; }
@media (prefers-color-scheme: dark) { text { fill: #f0efec; } .muted, .label { fill: #a3a29b; } }
</style>
<rect x="0" y="16" width="12" height="12" rx="3" fill="#b9b8b2"/>
<text x="18" y="26" class="muted">cold boot</text>
<rect x="104.8" y="16" width="12" height="12" rx="3" fill="#1baf7a"/>
<text x="122.8" y="26" class="muted">CRIU, CUDA and cuInterpose restore</text>
<rect x="389.6" y="16" width="12" height="12" rx="3" fill="#eb6834"/>
<text x="407.6" y="26" class="muted">weight reload</text>
<rect x="523.2" y="16" width="12" height="12" rx="3" fill="#7a5cd6"/>
<text x="541.2" y="26" class="muted">published by NVIDIA</text>
<text x="0" y="60" class="label">Cold boot, cold page cache</text>
<rect x="0.0" y="66" width="672.7" height="16" rx="4" fill="#b9b8b2"/>
<text x="680.2" y="79" class="value">166.1 s</text>
<text x="0" y="106" class="label">Cold boot, warm page cache</text>
<rect x="0.0" y="112" width="423.5" height="16" rx="4" fill="#b9b8b2"/>
<text x="431.0" y="125" class="value">104.7 s</text>
<text x="0" y="152" class="label">Restore, weights from a cold volume</text>
<rect x="0.0" y="158" width="51.7" height="16" rx="4" fill="#1baf7a"/>
<rect x="53.2" y="158" width="357.3" height="16" rx="4" fill="#eb6834"/>
<text x="418.0" y="171" class="value">101.5 s</text>
<text x="0" y="198" class="label">Restore, weights from page cache</text>
<rect x="0.0" y="204" width="50.5" height="16" rx="4" fill="#1baf7a"/>
<rect x="52.0" y="204" width="120.7" height="16" rx="4" fill="#eb6834"/>
<text x="180.1" y="217" class="value">42.9 s</text>
<text x="0" y="244" class="label">Dynamo Snapshot restore, published (B200, weights in the checkpoint)</text>
<rect x="0.0" y="250" width="124.3" height="16" rx="4" fill="#7a5cd6"/>
<text x="131.8" y="263" class="value">31.0 s</text>
<text x="0" y="290" class="label">Restore, weights from a serving replica over InfiniBand</text>
<rect x="0.0" y="296" width="53.3" height="16" rx="4" fill="#1baf7a"/>
<rect x="54.8" y="296" width="26.9" height="16" rx="4" fill="#eb6834"/>
<text x="89.2" y="309" class="value">20.5 s</text>
</svg>

      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: timesliceorchestrator
    app.kubernetes.io/instance: timeslice

---
# Source: timesliceorchestrator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeslice-timesliceorchestrator
  namespace: timeslice-system
  labels:
    helm.sh/chart: timesliceorchestrator-0.1.0
    app.kubernetes.io/name: timesliceorchestrator
    app.kubernetes.io/instance: timeslice
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timesliceorchestrator
      app.kubernetes.io/instance: timeslice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timesliceorchestrator
        app.kubernetes.io/instance: timeslice
    spec:
      serviceAccountName: timeslice-timesliceorchestrator
      containers:
        - name: timesliceorchestrator
          image: "ghcr.io/llm-d-incubation/llm-d-rl-time-slicing/timesliceorchestrator:latest"
          imagePullPolicy: Always
          args:
            - "--snapshot-agent-port=9001"
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            {}

# Source: timesliceorchestrator/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: timeslice-timesliceorchestrator
  namespace: timeslice-system
  labels:
    helm.sh/chart: timesliceorchestrator-0.1.0
